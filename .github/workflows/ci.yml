# GitHub Actions: build verification only. Never deploys.
#
# The Gitea workflow (.gitea/workflows/deploy.yaml) is what actually deploys to
# the Docker host; GitHub-hosted runners cannot reach that intranet. This job
# proves that what lands on GitHub still builds and boots.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  UV_COMPILE_BYTECODE: 1

# NOTE: `runs-on` cannot read the `env` context — referencing env there makes the
# whole workflow invalid and the run fails in 0s with zero jobs. The image is
# therefore written literally on each job; keep them in sync. It is pinned
# rather than `ubuntu-latest` because GitHub migrates that label to Ubuntu 26 on
# 2026-10-19, which would silently change the toolchain under us.
jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor matches requires-python (3.10) so the documented minimum is
        # actually verified; the rest track the distro Pythons we expect in the
        # field (Debian 12 -> 3.11, Ubuntu 24.04 -> 3.12) plus 3.14 to catch
        # breakage on newer releases before users hit it.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7   # node24 (v4 targets deprecated node20)
        with:
          fetch-depth: 0   # build number needs the full commit count
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Show interpreter
        run: uv run python -VV
      - name: Install locked dependencies
        # --frozen fails loudly if uv.lock is stale instead of resolving anew.
        run: uv sync --frozen --all-extras
      - name: Run test suite
        run: uv run pytest -q

  linux:
    name: Linux suite (container, real /proc + /sys)
    # Runs inside a container so the collectors see a real Linux kernel instead
    # of the macOS/fake tree. This caught a real bug: docker bind-mounts
    # /etc/hostname as a file, which /proc/mounts reports like a filesystem, and
    # the disk collector attributed the whole volume's usage to it.
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          mv /root/.local/bin/uv /usr/local/bin/uv
          uv --version
      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras
      - name: Full test suite on Linux
        run: uv run pytest -q
      - name: Collectors produce data from the real kernel
        # A container has no AMD GPU and no hwmon sensors, but cpu/mem/disk must
        # return real values rather than raising.
        # No heredocs inside YAML blocks: the block scalar's indentation is
        # passed through and Python sees "unexpected indent". -c keeps the code
        # on one shell line. Use `uv run python`, not bare `python`: the slim
        # image only ships python3.
        run: |
          set -euo pipefail
          uv run python -m hwmon.collectors > /tmp/collect.json
          uv run python -c "
          import json
          payload = json.load(open('/tmp/collect.json'))
          assert set(payload) == {'cpu', 'mem', 'gpu', 'disk'}, payload.keys()
          assert payload['mem']['total'] > 0, 'memory collector read nothing'
          assert payload['cpu']['threads'] >= 1, 'cpu collector counted no threads'
          # docker bind-mounts these as files; they must never appear as
          # filesystems in the disk collector
          mounts = [fs['mount'] for d in payload['disk'] for fs in d['fs']]
          assert '/etc/hostname' not in mounts, mounts
          assert '/etc/resolv.conf' not in mounts, mounts
          print('collectors OK:', {k: (len(v) if isinstance(v, list) else 'dict') for k, v in payload.items()})
          "
      - name: SQLite history works on a real filesystem
        run: |
          set -euo pipefail
          uv run python -c "
          import json, tempfile, pathlib
          from hwmon.pro import HistoryStore
          from hwmon import contract

          payload = json.load(open('/tmp/collect.json'))
          payload['ts'] = 1.0
          with HistoryStore(pathlib.Path(tempfile.mkdtemp()) / 'h.db') as store:
              store.record(payload)
              row = store.latest().as_dict()
          problems = contract.check_history_row(row)
          assert not problems, problems
          print('history row OK:', row)
          "

  lock:
    name: lock file is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: uv lock --check
        run: uv lock --check

  build:
    name: docker build + smoke
    runs-on: ubuntu-24.04
    needs: [test, linux, lock]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build image
        run: |
          VERSION="$(cut -d. -f1,2 VERSION).$(git rev-list --count HEAD)"
          echo "HWMON_VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build -t hwmon-web:ci .
      # No agent is reachable in CI, so the web container starts and serves the
      # page while /api/metrics returns 502 from the proxy. The smoke test is
      # therefore run in --page-only mode (page integrity + /healthz).
      - name: Boot container and smoke the page
        run: |
          set -euo pipefail
          docker run -d --name hwmon-ci -p 8080:8080 \
            -e AGENT_URL=http://127.0.0.1:9101 -e AGENT_TOKEN=ci -e HWMON_VERSION="$HWMON_VERSION" \
            hwmon-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          python3 tests/smoke.py http://127.0.0.1:8080 \
            --expect-index src/hwmon/static/index.html --page-only
          docker logs --tail 40 hwmon-ci
      - name: Container stayed up
        run: test "$(docker inspect -f '{{.State.Running}}' hwmon-ci)" = "true"
      - name: Dump logs on failure
        if: failure()
        run: docker logs --tail 80 hwmon-ci || true
      - name: Clean up
        if: always()
        run: docker rm -f hwmon-ci || true

  package:
    name: sdist + wheel
    runs-on: ubuntu-24.04
    needs: [test, linux, lock]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: The wheel must contain the dashboard
        run: |
          set -euo pipefail
          python3 -c "
          import zipfile, pathlib, sys
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          assert wheels, 'no wheel produced'
          names = zipfile.ZipFile(wheels[0]).namelist()
          for want in ('hwmon/static/index.html', 'hwmon/static/favicon.svg'):
              if want not in names:
                  sys.exit(f'wheel is missing {want}')
          print('wheel contains', len(names), 'entries including the dashboard')
          "
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          retention-days: 7
