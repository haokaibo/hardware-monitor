<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Monitor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
/* ===== Design tokens: color encodes state ===== */
:root{
  --bg:#000; --card:#0c0c0c; --line:#232326; --track:#242428;
  --text:#f5f5f7; --muted:#8e8e93; --dim:#636366;
  --green:#3ad683; --amber:#f5c842; --orange:#ff8a3d; --red:#fe5e5f; --accent:#fe7d3f; --blue:#4aa3ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
  --radius:12px; --gap:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.35;overflow-x:hidden}
b{font-weight:650}
small{display:block}

/* ===== Top nav: title and connection status on a single row ===== */
.nav{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.82);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1440px;margin:0 auto;height:48px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#b33b12);color:#fff;font-size:12px;flex:none}
.brand b{font-size:14px;letter-spacing:.2px;white-space:nowrap}
.sep{width:1px;height:16px;background:var(--line);flex:none}
.nav-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{position:fixed;right:12px;bottom:8px;z-index:9;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap;letter-spacing:.02em;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:99px;pointer-events:auto}
.ver:empty{display:none}
.ver.mismatch{color:var(--amber)}   /* agent version differs from the web build */
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;min-width:0}
.conn #status{overflow:hidden;text-overflow:ellipsis}
.nav-right{display:flex;align-items:center;gap:14px;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(58,214,131,.14)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(245,200,66,.14)}
.dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(254,94,95,.16);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

/* ===== Page body ===== */
main{max-width:1440px;margin:0 auto;padding:18px 28px 34px}

/* ===== Row 1: top-level KPI cards ===== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.kpi-val{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-family:var(--mono);font-size:11px;color:var(--dim);min-height:14px}
.kpi-sub.ok{color:var(--green)} .kpi-sub.warn{color:var(--amber)} .kpi-sub.crit{color:var(--red)}
/* Trend range switcher */
.trend-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.tt-left{display:flex;align-items:center;gap:12px;min-width:0}
.tt-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tt-live{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim)}
.tt-live i{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite}
.ranges{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.range{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;line-height:1.4;padding:3px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.range:hover{color:var(--text)}
.range.on{background:rgba(255,255,255,.09);color:var(--text)}

/* KPI mini sparklines */
.kpi-trend{margin-top:7px;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{margin-top:2px;color:var(--green)}
.spark svg{display:block;width:100%;height:34px}
.spark.warn{color:var(--amber)} .spark.high{color:var(--orange)} .spark.crit{color:var(--red)}
/* Large card: specs + usage + trend + details */
.kpis.big{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.kpis.big .kpi{padding:14px 18px 16px;gap:2px}
.kpis.big .kpi-val{font-size:36px}
.kpis.big .kpi-sub{font-size:12px}
.kpis.big .spark svg{height:54px}
.kpis.big .kpi-trend{margin-top:10px}
.kmeta{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.4;margin:1px 0 8px;min-height:15px}
.krows{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.vtrend .spark svg{height:34px}
.kpis.big .chips{margin-top:12px}
/* RAM card embeds the PCIe link: both share one card whose total height matches the
   CPU/GPU cards in the same row */
.kpi-pcie{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.kpi-pcie .kpi-val{font-size:22px}
.spark .line{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark .area{fill:currentColor;opacity:.10;stroke:none}

/* ===== Error banner: one line by default, details expandable ===== */
.errwrap{margin-top:12px}
.errwrap[hidden]{display:none}
.errbox{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;background:var(--card)}
.errbox.red{border-color:rgba(254,94,95,.38);background:rgba(254,94,95,.06)}
.errbox.amber{border-color:rgba(245,200,66,.35);background:rgba(245,200,66,.05)}
.errbox summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;color:var(--muted);min-height:20px}
.errbox summary::-webkit-details-marker{display:none}
.errbox summary b{color:var(--text);font-weight:600}
.errbox.red summary b{color:var(--red)}
.errbox.amber summary b{color:var(--amber)}
.edot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.errbox.amber .edot{background:var(--amber)}
.ebrief{font-family:var(--mono);font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.etoggle{margin-left:auto;font-size:11px;color:var(--muted);flex:none}
.etoggle::after{content:" ▾"}
.errbox[open] .etoggle::after{content:" ▴"}
.edetail{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--muted);word-break:break-word;white-space:pre-wrap}

/* ===== Shared section styles ===== */
.module{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px 14px;min-width:0}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.mhead h2{font-size:16px;font-weight:650;letter-spacing:-.01em;flex:none}
.mmeta{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Metric row + slim progress bar */
.mrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:24px}
.mlabel{font-size:13px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlabel small{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mval{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--track);border-radius:99px;overflow:hidden;margin:4px 0 9px}
.bar:last-child{margin-bottom:0}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;transition:width .5s cubic-bezier(.4,0,.2,1),background .3s}
.bar>i.ok{background:var(--green)} .bar>i.warn{background:var(--amber)} .bar>i.high{background:var(--orange)}
.bar>i.crit{background:var(--red)} .bar>i.info{background:var(--blue)}

/* GPU temps: inline chips instead of one progress bar each */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);padding-right:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);flex:none}
.chip b{color:var(--text);font-weight:600}
.chip.ok::before{background:var(--green)} .chip.warn::before{background:var(--amber)} .chip.crit::before{background:var(--red)}
.chip.crit b{color:var(--red)} .chip.warn b{color:var(--amber)}


/* ===== Row 3: compact storage list ===== */
.storage{margin-top:var(--gap)}
.disk{padding:7px 0 8px;border-top:1px solid var(--line)}
.disk:first-child{border-top:0;padding-top:2px}
.disk-main{display:flex;align-items:baseline;gap:10px}
.disk-name{flex:1;min-width:0;font-size:13px;overflow:hidden}
.disk-name .mnt{color:var(--text)}
.disk-sub{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disk-use{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.disk-temp{font-family:var(--mono);font-size:11.5px;min-width:44px;text-align:right;white-space:nowrap}
.disk-temp.ok{color:var(--green)} .disk-temp.warn{color:var(--amber)} .disk-temp.crit{color:var(--red)}
.disk .bar{margin:7px 0 0}
.disk.sub{padding-left:16px;position:relative}
.disk.sub::before{content:"└";position:absolute;left:2px;top:8px;color:var(--dim);font-size:11px}
.empty{color:var(--dim);font-size:12px;padding:6px 0}
.note{color:var(--dim);font-size:10.5px;font-family:var(--mono);margin-top:10px}


/* ===== Responsive: expanded on wide screens, tighter on laptops, secondary info
   collapsed on narrow screens ===== */
@media (max-width:1024px){
  main{padding:16px 20px 28px}
  .nav-inner{padding:0 20px}
  :root{--gap:12px}
  .kpi-val{font-size:22px}
}
@media (max-width:900px){
  .kpis.big{grid-template-columns:1fr}
}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .nav-label{display:none}
  .disk-sub{display:none}
  }
@media (max-width:520px){
  main{padding:12px 14px 24px}
  .nav-inner{padding:0 14px}
  .kpi{padding:10px 12px 11px}
  .kpi-val{font-size:20px}
  .kpi-name{font-size:10px}
  .mhead h2{font-size:15px}
  .mhead .mmeta{display:none}      /* hide model and other secondary info on narrow screens */
  .disk-use{font-size:11px}
  .disk-temp{min-width:38px}
  .chip.opt{display:none}          /* collapse secondary temperatures on narrow screens */
  .sep{display:none}
  .nav-right{gap:10px}
  .spark svg{height:28px}
  .trend-toolbar{flex-wrap:wrap;gap:8px}
  .tt-live{display:none}
}
@media (max-width:420px){
  .brand b{display:none}
}
@media (max-width:380px){
  .kpis{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      <span class="logo">◈</span>
      <b>Hardware.ai</b>
      <span class="sep"></span>
      <span class="nav-label" id="label">SYSTEM OVERVIEW</span>
    </div>
    <div class="nav-right">
      <div class="ranges lang" id="lang" role="group" aria-label="Language"><button class="range" data-lang="en">EN</button><button class="range" data-lang="zh">中文</button></div>
      <div class="conn"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
    </div>
  </div>
</header>
  <!-- Error: one line by default, details expandable -->

<main>
  <div class="errwrap" id="errwrap" hidden></div>
  
  <!-- Trend time range -->
  <div class="trend-toolbar">
    <div class="tt-left"><span class="tt-title" data-i18n="trendWindow">Trend window</span><span class="tt-live"><i></i><span data-i18n="live">Live</span></span></div>
    <div class="ranges" id="ranges">
      <button class="range on" data-sec="60" data-i18n="r60">60 s</button>
      <button class="range" data-sec="300" data-i18n="r300">5 min</button>
      <button class="range" data-sec="900" data-i18n="r900">15 min</button>
      <button class="range" data-sec="3600" data-i18n="r3600">1 hr</button>
    </div>
  </div>

  <!-- Row 1: three large cards for CPU / GPU / RAM (specs, usage, trend and details combined) -->
  <section class="kpis big">
    <div class="kpi" data-metric="cpu">
      <div class="kpi-name">CPU</div>
      <div class="kmeta" id="cpu-meta">–</div>
      <div class="kpi-val" id="k-cpu-v">–</div><div class="kpi-sub" id="k-cpu-s">–</div>
      <div class="kpi-trend" data-k="cpu">Last 60 s</div>
      <div class="spark"><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="sf-cpu" d=""/><path class="line" id="sp-cpu" d=""/></svg></div>
      <div class="krows" id="cpu-rows"></div>
    </div>
    <div class="kpi" data-metric="gpu">
      <div class="kpi-name">GPU</div>
      <div class="kmeta" id="gpu-meta">–</div>
      <div class="kpi-val" id="k-gpu-v">–</div><div class="kpi-sub" id="k-gpu-s">–</div>
      <div class="kpi-trend" data-k="gpu">Last 60 s</div>
      <div class="spark"><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="sf-gpu" d=""/><path class="line" id="sp-gpu" d=""/></svg></div>
      <div class="krows" id="gpu-rows"></div>
      <div class="chips" id="gpu-temps"></div>
    </div>
    <div class="kpi" data-metric="ram">
      <div class="kpi-name">RAM</div>
      <div class="kmeta">DRAM · Swap</div>
      <div class="kpi-val" id="k-ram-v">–</div><div class="kpi-sub" id="k-ram-s">–</div>
      <div class="kpi-trend" data-k="ram">Last 60 s</div>
      <div class="spark"><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="sf-ram" d=""/><path class="line" id="sp-ram" d=""/></svg></div>
      <div class="krows" id="mem-rows"></div>
      <div class="kpi-pcie">
        <div class="kpi-name" data-i18n="pcieLink">PCIe Link</div><div class="kpi-val" id="k-pcie-v">–</div><div class="kpi-sub" id="k-pcie-s">–</div>
      </div>
    </div>
  </section>

  <!-- Row 3: compact storage list -->
  <section class="module storage">
    <div class="mhead"><h2 data-i18n="storage">Storage</h2><span class="mmeta" id="disk-meta">–</span></div>
    <div id="disk-list"></div>
    <div class="note" id="disk-note"></div>
  </section>
</main>

<span class="ver" id="ver"></span>   <!-- Version: bottom right, highlighted when the agent and the web build differ -->

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = n => Math.max(0, Math.min(100, isFinite(n) ? n : 0));
const fmt = b => b == null ? '–' : b >= 2 ** 40 ? (b / 2 ** 40).toFixed(2) + ' TB' : (b / 2 ** 30).toFixed(1) + ' GB';
const fmtDisk = b => { // Use GB throughout a single row: avoids mixing GB/TB and makes values comparable
  if (b == null) return '–';
  const g = b / 2 ** 30;
  return (g >= 100 ? Math.round(g).toLocaleString('en-US') : g.toFixed(1)) + ' GB';
};
const pct = v => v == null ? '–' : (v < 1 ? v.toFixed(1) : v.toFixed(0)) + '%';

/* ===== i18n: English by default, switch in the top right, choice saved to localStorage ===== */
const I18N = {
  en: {
    title: 'Hardware Monitor', overview: 'SYSTEM OVERVIEW', langLabel: 'Language',
    trendWindow: 'Trend window', live: 'Live',
    r60: '60 s', r300: '5 min', r900: '15 min', r3600: '1 hr',
    last60: 'Last 60 s', last300: 'Last 5 min', last900: 'Last 15 min', last3600: 'Last 1 hr',
    peak: 'Peak', scale: 'Scale',
    pcieLink: 'PCIe Link', storage: 'Storage',
    connecting: 'Connecting…', online: 'System online', disconnected: 'Disconnected',
    stalledStatus: s => `Data stalled ${s} s`,
    threads: n => `${n} threads`, load: 'Load',
    usage: 'Usage', freq: 'Frequency', temp: 'Temperature',
    sysMem: 'System memory', swapSpace: 'Swap space',
    noGpu: 'No discrete GPU detected', free: 'Free', power: 'Power', tempUnavail: 'Temp sensors unavailable',
    driveSize: 'Drive size',
    disks: n => `${n} ${n === 1 ? 'disk' : 'disks'}`, noDisks: 'No disks detected',
    diskNote: 'Model and filesystem are in the subtitle / hover tooltip; temperature is the reading for the whole physical drive.',
    details: 'Details',
    errConn: 'Agent connection failed', errStale: 'Agent data stalled', errPartial: 'Some sensor data unavailable',
    staleDetail: s => `No new samples for ${s} s; showing the last data received.\nCheck the agent process on the monitored host.`,
    timeout: 'Request timed out (no response in 4 s)', reach: 'Cannot reach agent'
  },
  zh: {
    title: '硬件监控', overview: '系统概览', langLabel: '语言',
    trendWindow: '趋势时间范围', live: '实时更新',
    r60: '60 秒', r300: '5 分钟', r900: '15 分钟', r3600: '1 小时',
    last60: '最近 60 秒', last300: '最近 5 分钟', last900: '最近 15 分钟', last3600: '最近 1 小时',
    peak: '峰值', scale: '量程',
    pcieLink: 'PCIe 链路', storage: '存储设备',
    connecting: '连接中…', online: '系统在线', disconnected: '连接中断',
    stalledStatus: s => `数据停滞 ${s} 秒`,
    threads: n => `${n} 线程`, load: '负载',
    usage: '使用率', freq: '频率', temp: '温度',
    sysMem: '系统内存', swapSpace: '交换分区',
    noGpu: '未检测到独立 GPU', free: '可用', power: '功耗', tempUnavail: '温度传感器不可用',
    driveSize: '设备容量',
    disks: n => `${n} 块磁盘`, noDisks: '未检测到可用磁盘',
    diskNote: '设备型号与文件系统见副标题 / 悬停提示；温度为该物理盘整盘读数。',
    details: '查看详情',
    errConn: 'Agent 连接失败', errStale: 'Agent 数据停滞', errPartial: '部分传感器数据不可用',
    staleDetail: s => `已 ${s} 秒没有新的采样，页面显示的是最后一次数据。\n请检查被监控宿主机上的 agent 进程。`,
    timeout: '请求超时（4 秒无响应）', reach: '无法连接 agent'
  }
};
let lang = 'en';
try { const saved = localStorage.getItem('hw_lang'); if (saved === 'en' || saved === 'zh') lang = saved; } catch (_) {}
const tr = (k, ...a) => {
  const v = (I18N[lang] || I18N.en)[k] ?? I18N.en[k] ?? k;
  return typeof v === 'function' ? v(...a) : v;
};
// The backend (app.py proxy) returns a Chinese error prefix; map it to English in the EN UI
const localizeErr = msg => lang === 'en' ? String(msg).replace(/^无法连接 agent:\s*/, tr('reach') + ': ') : msg;

/* ===== Configurable thresholds: normal / near limit / over limit =====
   Override from outside the page via window.HW_THRESHOLDS, e.g.:
   window.HW_THRESHOLDS = { t_cpu:{warn:70,crit:85} } */
const TH = Object.assign({
  cpu:{warn:55,high:75,crit:90}, gpu:{warn:55,high:75,crit:90}, ram:{warn:55,high:75,crit:90}, vram:{warn:55,high:75,crit:90},   // Usage has four levels: <=54% green, 55-74% yellow, 75-89% orange, >=90% red
 
  disk:{warn:80,crit:92}, ctx:{warn:75,crit:90},
  t_cpu:{warn:75,crit:90},
  t_gpu_mem:{warn:85,crit:95}, t_gpu:{warn:78,crit:90}, t_gpu_junction:{warn:85,crit:100},
  t_nvme:{warn:60,crit:75}, t_ssd:{warn:55,crit:70}, t_hdd:{warn:50,crit:60},
  freq_max:5000
}, window.HW_THRESHOLDS || {});

const level = (v, key) => {
  const t = TH[key]; if (!t || v == null) return 'ok';
  if (t.high != null) v = Math.round(v);          // Four-level metrics are judged on the rounded percentage shown on the page (30.6% shows as 31%, i.e. yellow)
  return v >= t.crit ? 'crit' : (t.high != null && v >= t.high) ? 'high' : v >= t.warn ? 'warn' : 'ok';
};

/* One metric row + slim progress bar */
const metric = (name, sub, frac, lv, value) =>
  `<div class="mrow"><div class="mlabel">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>` +
  `<div class="mval">${value}</div></div>` +
  `<div class="bar"><i class="${lv}" style="width:${clamp(frac)}%"></i></div>`;

/* Inline temperature chips */
const chip = (name, v, key, opt) => {
  const lv = level(v, key);
  return `<span class="chip ${lv}${opt ? ' opt' : ''}">${esc(name)} <b>${v == null ? '–' : v.toFixed(0) + '°C'}</b></span>`;
};

function setKpi(id, val, sub, subVal, subKey) {
  $('#k-' + id + '-v').textContent = val;
  const s = $('#k-' + id + '-s');
  s.textContent = sub;
  s.className = 'kpi-sub' + (subKey && subVal != null ? ' ' + level(subVal, subKey) : '');
}

/* ===== KPI sparklines: fixed-size ring buffer in the frontend, 1 point per second,
   no repeated history fetches ===== */
const HIST_MAX = 3600;                                  // 1 hour @1Hz
const HIST = { cpu: [], gpu: [], vram: [], ram: [] };
const RANGE_TEXT = sec => tr('last' + sec);
let rangeSec = 60;
let lastMetrics = null;
let diskSig = '';

/* ===== Version (major.minor.build): the web build version comes from /api/info (written by CI on every push);
   the agent version is reported with /api/metrics; a mismatch is highlighted to flag an agent
   that was not updated ===== */
let webVer = '';
fetch('/api/info').then(r => r.json()).then(d => { webVer = d.version || ''; renderVer(); }).catch(() => {});
function renderVer() {
  const el = $('#ver');
  const aVer = lastMetrics && lastMetrics.version;
  let txt = webVer ? 'v' + webVer : '';
  if (aVer && aVer !== webVer) txt += (txt ? ' · ' : '') + 'agent v' + aVer;
  el.textContent = txt;
  el.classList.toggle('mismatch', !!(webVer && aVer && aVer !== webVer));
}

function record(m) {
  const c = m.cpu || {}, r = m.mem || {}, g = (m.gpus || [])[0] || {}, GB = 2 ** 30;
  const add = (k, v) => {
    if (v == null || !isFinite(v)) return;
    const a = HIST[k];
    a.push(v);
    if (a.length > HIST_MAX) a.splice(0, a.length - HIST_MAX);
  };
  add('cpu', c.usage);
  add('gpu', g.usage);
  add('vram', g.vram_used != null ? g.vram_used / GB : null);
  add('ram', r.used != null ? r.used / GB : null);
}

function drawSparks(m) {
  const g = (m.gpus || [])[0] || {}, r = m.mem || {}, GB = 2 ** 30;
  const cap = { vram: g.vram_total ? g.vram_total / GB : 0, ram: r.total ? r.total / GB : 0 };
  const W = 100, H = 30, PAD = 3;
  const setTrend = (k, t) => document.querySelectorAll(`[data-k="${k}"]`).forEach(el => { el.textContent = t; });
  const fp = v => v < 1 ? v.toFixed(1) : v.toFixed(0);
  for (const k of ['cpu', 'gpu', 'vram', 'ram']) {
    const vals = HIST[k].slice(-rangeSec);
    const line = document.getElementById('sp-' + k), area = document.getElementById('sf-' + k);
    if (!vals.length) { line.setAttribute('d', ''); area.setAttribute('d', ''); setTrend(k, RANGE_TEXT(rangeSec)); continue; }
    // Y axis: CPU/GPU percentages use 0..max(10, peak) so fluctuations stay visible; VRAM/RAM use 0..total to read absolute usage
    const peak = Math.max(...vals);
    const hi = (k === 'cpu' || k === 'gpu') ? Math.min(100, Math.max(10, peak * 1.25))
      : (cap[k] || Math.max(1, peak * 1.25));
    const isPct = k === 'cpu' || k === 'gpu';
    setTrend(k, `${RANGE_TEXT(rangeSec)} · ${tr('peak')} ${isPct ? fp(peak) + '%' : peak.toFixed(1) + ' GB'} · ${tr('scale')} 0–${isPct ? fp(hi) + '%' : hi.toFixed(1) + ' GB'}`);
    const cur = vals[vals.length - 1], curPct = isPct ? cur : (cap[k] ? cur / cap[k] * 100 : 0);
    line.closest('.spark').className = 'spark ' + level(curPct, k);   // line color follows the current usage level
    const y = v => PAD + (1 - Math.min(1, Math.max(0, v / hi))) * (H - 2 * PAD);
    let d;
    if (vals.length === 1) {
      d = `M0 ${y(vals[0]).toFixed(2)} L${W} ${y(vals[0]).toFixed(2)}`;
    } else {
      d = '';
      vals.forEach((v, i) => { d += `${i ? ' L' : 'M'}${(i / (vals.length - 1) * W).toFixed(2)} ${y(v).toFixed(2)}`; });
    }
    line.setAttribute('d', d);
    area.setAttribute('d', `${d} L${W} ${H} L0 ${H} Z`);
  }
}

function render(m, fresh = true) {
  const c = m.cpu || {}, r = m.mem || {}, g = (m.gpus || [])[0] || {};
  const t = g.temps || {};
  const gTemp = t.edge != null ? t.edge : (Object.values(t).length ? Math.max(...Object.values(t)) : null);

  $('#label').textContent = `${m.label ? m.label + ' · ' : ''}${tr('overview')}`;

  /* ---- Row 1 ---- */
  const ramPct = r.total ? r.used / r.total * 100 : 0;
  setKpi('cpu', pct(c.usage), c.temp != null ? c.temp.toFixed(0) + '°C' : '–', c.temp, 't_cpu');
  setKpi('gpu', pct(g.usage), gTemp != null ? gTemp.toFixed(0) + '°C' : '–', gTemp, 't_gpu');
  setKpi('ram', fmt(r.used), '/ ' + fmt(r.total));
  const pc = g.pcie || {};
  setKpi('pcie', pc.gen ? `Gen${pc.gen} x${pc.width}` : '–', pc.gbps ? `${pc.gbps} GB/s` : '');

  /* ---- CPU ---- */
  $('#cpu-meta').textContent = [(c.model || '').replace(/\s+\d+-Core Processor/i, ''), c.threads ? tr('threads', c.threads) : ''].filter(Boolean).join(' · ') || '–';
  const load = (c.load || []).map(x => x.toFixed(2)).join(' / ');
  $('#cpu-rows').innerHTML =
    metric(tr('usage'), load ? tr('load') + ' ' + load : '', c.usage || 0, level(c.usage, 'cpu'), pct(c.usage)) +
    (c.freq_mhz != null ? metric(tr('freq'), '', c.freq_mhz / TH.freq_max * 100, 'info', c.freq_mhz + ' MHz') : '') +
    metric(tr('temp'), 'Tctl / Package', c.temp == null ? 0 : c.temp, level(c.temp, 't_cpu'), c.temp == null ? '–' : c.temp.toFixed(0) + '°C');

  /* ---- Memory ---- */
  const swapPct = r.swap_total ? r.swap_used / r.swap_total * 100 : 0;
  $('#mem-rows').innerHTML =
    metric('DRAM', tr('sysMem'), ramPct, level(ramPct, 'ram'), `${fmt(r.used)} / ${fmt(r.total)}`) +
    (r.swap_total ? metric('Swap', tr('swapSpace'), swapPct, level(swapPct, 'ram'), `${fmt(r.swap_used)} / ${fmt(r.swap_total)}`) : '');

  /* ---- GPU ---- */
  $('#gpu-meta').textContent = g.name || tr('noGpu');
  const pwrPct = g.power_cap_w ? (g.power_w || 0) / g.power_cap_w * 100 : 0;
  $('#gpu-rows').innerHTML =
    `<div class="mrow"><div class="mlabel">VRAM${g.vram_total ? `<small>${tr('free')} ${fmt(g.vram_total - (g.vram_used || 0))}</small>` : ''}</div>` +
    `<div class="mval">${fmt(g.vram_used)} / ${fmt(g.vram_total)}</div></div>` +
    `<div class="kpi-trend vtrend" data-k="vram">${RANGE_TEXT(rangeSec)}</div>` +
    `<div class="spark"><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="sf-vram" d=""/><path class="line" id="sp-vram" d=""/></svg></div>` +
    metric(tr('power'), '', pwrPct, 'info', `${g.power_w != null ? g.power_w.toFixed(0) : '–'} W / ${g.power_cap_w ? g.power_cap_w.toFixed(0) + ' W' : '–'}`);

  const order = ['mem', 'edge', 'junction'];
  const keys = { mem: 't_gpu_mem', edge: 't_gpu', junction: 't_gpu_junction' };
  const present = order.filter(k => t[k] != null);
  const hottest = present.slice().sort((a, b) => t[b] - t[a])[0];
  $('#gpu-temps').innerHTML = present.length
    ? present.map(k => chip(k.toUpperCase(), t[k], keys[k], k !== hottest)).join('')
    : `<span class="chip">${esc(tr('tempUnavail'))}</span>`;

  /* Sparklines must be drawn after gpu-rows is rebuilt, otherwise innerHTML wipes the VRAM chart */
  if (fresh) record(m);               // do not record history while data is stalled
  drawSparks(m);
  lastMetrics = m;

  /* ---- Storage: device/mount - usage - temperature, one row each ---- */
  const disks = m.disks || [];
  const tkey = d => d.kind === 'NVMe' ? 't_nvme' : d.kind === 'HDD' ? 't_hdd' : 't_ssd';
  let rows = '', totalBytes = 0, shown = 0;
  for (const d of disks) {
    const fs = (d.fs || [])
      .filter(f => f.total >= 512 * 2 ** 20 && !(f.fstype === 'vfat' && f.total < 4 * 2 ** 30))
      .sort((a, b) => b.total - a.total);
    if (!fs.length) continue;
    shown++;
    totalBytes += d.size || 0;
    fs.forEach((f, i) => {
      const frac = f.total ? f.used / f.total * 100 : 0;
      const info = [d.model || d.name, f.fstype, tr('driveSize') + ' ' + fmt(d.size), tr('free') + ' ' + fmt(f.avail)].filter(Boolean).join(' · ');
      rows += `<div class="disk${i ? ' sub' : ''}" title="${esc(info)}">
        <div class="disk-main">
          <div class="disk-name">${esc(d.kind)} · <span class="mnt">${esc(f.mount)}</span>
            <span class="disk-sub">${esc(info)}</span></div>
          <div class="disk-use">${fmtDisk(f.used)} / ${fmtDisk(f.total)}</div>
          <div class="disk-temp ${level(d.temp, tkey(d))}">${d.temp == null ? '–' : d.temp.toFixed(0) + '°C'}</div>
        </div>
        <div class="bar"><i class="${level(frac, 'disk')}" style="width:${clamp(frac)}%"></i></div>
      </div>`;
    });
  }
  const sig = JSON.stringify(disks);
  if (sig !== diskSig) {                       // disks change every 10 s; avoid rebuilding the DOM every second
    diskSig = sig;
    $('#disk-list').innerHTML = rows || `<p class="empty">${esc(tr('noDisks'))}</p>`;
    $('#disk-meta').textContent = disks.length ? `${tr('disks', shown)} · ${fmt(totalBytes)}` : '';
    $('#disk-note').textContent = rows ? tr('diskNote') : '';
  }
  renderVer();   // the agent version arrives with the data and may change
}


/* ===== Error banner: red dot + one-line summary, details expandable ===== */
function showError(kind, brief, detail) {
  const w = $('#errwrap');
  w.hidden = false;
  w.innerHTML = `<details class="errbox ${kind}">
    <summary><span class="edot"></span><b>${esc(brief)}</b><span class="ebrief">${esc(detail).split('\n')[0]}</span><span class="etoggle">${esc(tr('details'))}</span></summary>
    <div class="edetail">${esc(detail)}</div>
  </details>`;
}
function clearError() { $('#errwrap').hidden = true; $('#errwrap').innerHTML = ''; }

/* ===== Errors and status: keep generator functions so a language switch can re-render ===== */
let errState = null;
let renderStatus = () => { $('#dot').className = 'dot'; $('#status').textContent = tr('connecting'); };
function showErr() {
  if (!errState) return clearError();
  showError(errState.kind, tr(errState.brief), localizeErr(errState.detail()));
}
function setErr(kind, brief, detail) { errState = { kind, brief, detail }; showErr(); }
function clearErr() { errState = null; clearError(); }

/* ===== Polling: schedule the next request only after the current one finishes (no overlap),
   4 s timeout; detect whether agent data has stalled ===== */
const STALE_MS = 5000;
let timer = null, lastTs = null, lastTsAt = Date.now();

async function tick() {
  clearTimeout(timer);
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 4000);
  try {
    const res = await fetch('/api/metrics', { cache: 'no-store', signal: ctl.signal });
    const m = await res.json();
    if (!res.ok || (m.error && !m.cpu)) throw new Error(m.error || 'HTTP ' + res.status);

    // Treat the sample timestamp as the freshness signal; timing uses the local clock so that
    // clock skew between the host and the browser does not matter
    const now = Date.now();
    const fresh = m.ts !== lastTs;
    if (fresh) { lastTs = m.ts; lastTsAt = now; }
    const stale = now - lastTsAt > STALE_MS;

    render(m, fresh);
    const clock = new Date().toLocaleTimeString('en-GB', { hour12: false });
    if (stale) {
      const sec = Math.round((now - lastTsAt) / 1000);
      renderStatus = () => { $('#dot').className = 'dot warn'; $('#status').textContent = `${tr('stalledStatus', sec)} · ${clock}`; };
      setErr('amber', 'errStale', () => tr('staleDetail', sec) + (m.error ? '\n' + m.error : ''));
    } else {
      renderStatus = () => { $('#dot').className = 'dot ok'; $('#status').textContent = `${tr('online')} · ${clock}`; };
      if (m.error) setErr('amber', 'errPartial', () => m.error); else clearErr();
    }
    renderStatus();
  } catch (e) {
    renderStatus = () => { $('#dot').className = 'dot err'; $('#status').textContent = tr('disconnected'); };
    renderStatus();
    setErr('red', 'errConn', e.name === 'AbortError' ? () => tr('timeout') : () => e.message);
  } finally {
    clearTimeout(to);
    timer = setTimeout(tick, 1000);
  }
}

/* ===== Language switch ===== */
function applyStatic() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = tr('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = RANGE_TEXT(rangeSec); });
  $('#label').textContent = `${(lastMetrics && lastMetrics.label) ? lastMetrics.label + ' · ' : ''}${tr('overview')}`;
  const lg = $('#lang');
  lg.setAttribute('aria-label', tr('langLabel'));
  lg.querySelectorAll('.range').forEach(b => {
    const on = b.dataset.lang === lang;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
}
function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem('hw_lang', l); } catch (_) {}
  applyStatic();
  renderStatus();
  showErr();
  diskSig = '';                                   // force a redraw of the storage section (subtitle and note included)
  if (lastMetrics) render(lastMetrics, false);    // redraw with the latest data without recording history
}
$('#lang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (b) setLang(b.dataset.lang);
});

applyStatic();
renderStatus();
tick();
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });   // refresh immediately when the tab becomes visible again

/* Range switch: only changes the render window, no refetch */
$('#ranges').addEventListener('click', e => {
  const btn = e.target.closest('.range');
  if (!btn) return;
  rangeSec = +btn.dataset.sec;
  document.querySelectorAll('#ranges .range').forEach(x => x.classList.toggle('on', x === btn));
  if (lastMetrics) drawSparks(lastMetrics);
});
</script>
</body>
</html>
