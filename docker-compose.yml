services:
  hwmon-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hwmon-web:latest
    container_name: hwmon-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Values come from the .env in this directory (filled in by hand or written by CI)
      AGENT_URL: "${AGENT_URL:?set AGENT_URL in .env}"
      AGENT_TOKEN: "${AGENT_TOKEN:?set AGENT_TOKEN in .env}"
      HWMON_VERSION: "${HWMON_VERSION:-dev}"   # version shown on the page (major.minor.build); written by CI on every push
    # cap container logs so a long-running deployment cannot fill the disk
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
