# Gitea Actions only. GitHub does not read .gitea/workflows/, so pushing to a
# GitHub mirror never triggers this job. GitHub builds live in
# .github/workflows/ci.yml (build + smoke test, no deployment).
name: deploy-hwmon

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hwmon
  cancel-in-progress: true

jobs:
  deploy:
    # Needs a self-hosted runner on the Docker host, tagged `hwmon-host`.
    runs-on: hwmon-host
    steps:
      - name: Fetch code and rebuild container
        env:
          GIT_REPO_URL: ${{ secrets.GIT_REPO_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          AGENT_URL: ${{ secrets.AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          # 1) Fetch the latest main branch (GIT_REPO_URL looks like
          #    http://host:port/owner/repo.git and carries no credentials)
          if [ -z "${GIT_REPO_URL:-}" ]; then
            echo "Missing Gitea secret GIT_REPO_URL (shaped like http://<GITEA_HOST>:3000/<owner>/<repo>.git)" >&2
            exit 1
          fi
          # diagnostics without leaking the token: confirm the secret is set
          echo "GIT_REPO_URL is set: [${GIT_REPO_URL}]"
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "Missing Gitea secret DEPLOY_TOKEN (a token that can read this repository)" >&2
            exit 1
          fi
          # Inject credentials into the URL: http://host/... -> http://deploy:<token>@host/...
          # Avoid string substitution (bash versions disagree on //), use %/: split + concat
          case "$GIT_REPO_URL" in
            http://*|https://*) ;;
            *) echo "GIT_REPO_URL must start with http(s)://" >&2; exit 1 ;;
          esac
          SCHEME="${GIT_REPO_URL%%://*}"
          HOST_PATH="${GIT_REPO_URL#*://}"
          GIT_REPO_URL="$SCHEME://deploy:$DEPLOY_TOKEN@$HOST_PATH"
          # diagnostics without leaking the token: credentials injected, scheme correct
          echo "clone URL (token hidden): ${GIT_REPO_URL/deploy:*deploy:<token>@}"
          # full clone (not --depth 1): the build number is the total commit count
          git clone --branch main "$GIT_REPO_URL" "$WORKDIR/src"

          # 2) Sync into the deploy directory, keeping the host's .env and tolerating
          #    machines without rsync
          DEPLOY_DIR=/opt/hwmon
          mkdir -p "$DEPLOY_DIR"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete \
              --exclude '.git' --exclude '.gitea' --exclude '.env' \
              --exclude '.venv' --exclude '__pycache__' \
              "$WORKDIR/src/" "$DEPLOY_DIR/"
          else
            echo "rsync not found, falling back to find + cp"
            find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
            cp -a "$WORKDIR/src/." "$DEPLOY_DIR/"
            rm -rf "$DEPLOY_DIR/.git" "$DEPLOY_DIR/.gitea"
          fi

          # 3) Write runtime config from Gitea secrets; keep an existing .env when unset.
          #    Version = major.minor (VERSION file, bumped by hand) + build number
          #    (total commits, +1 per push), e.g. 1.0.123, shown at the page bottom right.
          HWMON_VERSION="$(cut -d. -f1,2 "$WORKDIR/src/VERSION").$(git -C "$WORKDIR/src" rev-list --count HEAD)"
          if [ -n "${AGENT_URL:-}" ] && [ -n "${AGENT_TOKEN:-}" ]; then
            umask 077
            printf 'AGENT_URL=%s\nAGENT_TOKEN=%s\nHWMON_VERSION=%s\n' "$AGENT_URL" "$AGENT_TOKEN" "$HWMON_VERSION" > "$DEPLOY_DIR/.env"
            echo "HWMON_VERSION=$HWMON_VERSION written to $DEPLOY_DIR/.env"
          fi
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "Missing $DEPLOY_DIR/.env; configure the AGENT_URL / AGENT_TOKEN secrets" >&2
            exit 1
          fi

          # 4) Rebuild the image and roll the container
          cd "$DEPLOY_DIR"
          docker compose up -d --build
          docker image prune -f >/dev/null 2>&1 || true           # old dangling images
          docker builder prune -f --filter until=168h >/dev/null 2>&1 || true   # build cache older than 7 days
          docker system df
          docker compose ps

      - name: Health check
        run: |
          set -e
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' hwmon-web 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ] || curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "OK: hwmon-web health check passed (health=$status)"
              docker ps --filter name=hwmon-web --format '{{.Names}}  {{.Status}}'
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: health check failed, recent logs:" >&2
          docker logs --tail 60 hwmon-web 2>&1 || true
          exit 1
